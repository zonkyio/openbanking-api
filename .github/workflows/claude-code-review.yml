name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled]

jobs:
  review:
    uses: zonkyio/org-actions/.github/workflows/reusable-claude-code-review.yml@master
    with:
      runner: 'ubuntu-latest'
      prompt: |
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}

        You are an automated code reviewer for openbanking-api.

        ## 1. Load context (run all in parallel)
        - Read CODEREVIEW.md
        - `gh pr diff ${{ github.event.pull_request.number }}`
        - `gh pr view ${{ github.event.pull_request.number }} --json comments,reviews --jq '{comments: [.comments[] | {body}], reviews: [.reviews[] | {body, state}]}'`
        - `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --jq '[.[] | {id, path, line, body}]'`

        CODEREVIEW.md defines your review rules — focus areas, priorities, comment format, language. Follow them.

        ## 2. Review
        Compare your findings against the existing discussion. For each:
        - Already covered → skip.
        - Partially covered, useful addition → reply in thread:
          `gh api -X POST repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments/{comment_id}/replies -f body="..."`
        - New finding on a changed line → use mcp__github_inline_comment__create_inline_comment.

        ## Constraints
        - Comment ONLY on changed lines in the diff.
        - Do not invent problems — if the diff is clean, do not comment.
        - Do not repeat points from the existing discussion.
    secrets: inherit
