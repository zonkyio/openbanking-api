name: "🤖 AI PR Review"

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled]

jobs:
  ai-review:
    name: "🤖 AI PR Review (Reusable)"
    if: github.event.pull_request.draft == false
    permissions:
      actions: read
      contents: read
      pull-requests: write
      id-token: write
    uses: zonkyio/org-actions/.github/workflows/reusable-claude-code-review.yml@v2.2
    concurrency:
      group: claude-ai-review-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    with:
      pr_number: ${{ github.event.pull_request.number }}
      run_claude_review: ${{ contains(github.event.pull_request.labels.*.name, 'claude') }}
      run_security_review: false # disable security review for this repo as it is not required
      runner: 'ubuntu-latest'
      prompt: |
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}

        You are an automated code reviewer for openbanking-api.

        ## 1. Load context (run all in parallel)
        - Read CODEREVIEW.md if it exists in the repo root
        - `gh pr diff ${{ github.event.pull_request.number }}`
        - `gh pr view ${{ github.event.pull_request.number }} --json comments,reviews --jq '{comments: [.comments[] | {body}], reviews: [.reviews[] | {body, state}]}'`
        - `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --jq '[.[] | {id, path, line, body}]'`

        If CODEREVIEW.md exists it is the single source of truth for the review
        rules — focus areas, comment priorities, comment format, output policy and
        language. Follow it and ignore the fallback below.

        If it does not exist, review against general good practice for this
        repository's stack and its own local conventions, and:
        - write comments in English, only on lines changed in the diff,
        - start each comment with `[HIGH]`, `[MEDIUM]` or `[LOW]`,
        - keep each comment to 1-3 sentences: why it is a problem, then the fix,
        - prefer a few high-value comments over a long list of minor ones,
        - do not criticise style or formatting, and do not give generic advice,
        - say nothing on the diff if the change is fine.

        ## 2. Post the findings
        Compare your findings against the existing discussion. For each:
        - Already covered → skip.
        - Partially covered, useful addition → reply in thread:
          `gh api -X POST repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments/{comment_id}/replies -f body="..."`
        - New finding on a changed line → use mcp__github_inline_comment__create_inline_comment.

        ## 3. Post the run summary
        Always post a single run summary, including when you found nothing, using
        exactly this one-line format so that later runs can recognise and reuse it:
        - `🤖 AI review: done — N comment(s) posted`
        - `🤖 AI review: done — no findings`

        Update the existing one in place instead of adding another:
        `gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "..."`
        If your gh does not support those flags, find the previous `🤖 AI review`
        comment via
        `gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments`
        and PATCH it; POST a new one only when none exists yet.
    secrets: inherit
